name: Update API reference

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays
  workflow_dispatch:
    inputs:
      version:
        description: '@servicenow/aiux version (default: latest on npm)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(npm view @servicenow/aiux version)"
          fi
          CUR="$(node -p "require('./tools/api-reference/version.json').version")"
          echo "target=$V" >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "Current $CUR, target $V"

      - name: Generate
        if: steps.ver.outputs.target != steps.ver.outputs.current
        run: node tools/api-reference/generate.mjs --version "${{ steps.ver.outputs.target }}"

      - name: Open pull request
        if: steps.ver.outputs.target != steps.ver.outputs.current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.target }}
          CUR: ${{ steps.ver.outputs.current }}
        run: |
          if git diff --quiet -- docs/reference/api tools/api-reference/version.json; then
            echo "No changes."; exit 0
          fi
          BRANCH="api-reference/$V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/reference/api tools/api-reference/version.json
          git commit -m "API reference: @servicenow/aiux $V"
          git push -u origin "$BRANCH" --force
          gh pr create --title "API reference: @servicenow/aiux $V" \
            --body "Regenerated \`docs/reference/api/\` from \`@servicenow/aiux@$V\` (was $CUR). Review removed elements and changed signatures before merging, and update the version notes on the SDK pages if needed." \
            --base main --head "$BRANCH" || echo "PR may already exist"
