# Maps docs/ pages to the Ghost "aiux-docs" collection.
#
# The Ghost site routes /aiux-docs/{slug}/ to posts tagged #docs + #aiux-docs
# (see routes.yaml on the Ghost instance). Each entry here is one post.
#
#   file:    path relative to docs/
#   slug:    Ghost post slug -> https://relay.semaphorepartners.com/aiux-docs/<slug>/
#   title:   Ghost post title (defaults to the page's H1)
#   section: sidebar group
#   order:   sort within the section
#   status:  published | draft | unpublished  (state on the Ghost site as of 2026-09-03)
#
# Internal links in docs/ are relative paths. When publishing, rewrite
# `<relative path to file>[#anchor]` -> `/aiux-docs/<slug>/[#anchor]` using
# this table, and upload assets/screenshots/* to Ghost, rewriting image paths.

site: https://relay.semaphorepartners.com
collection: /aiux-docs/
tags: ["#docs", "#aiux-docs"]

pages:
  - file: introduction.md
    slug: ""                     # the collection index page
    title: Unofficial AI UX & Employee Slate Docs
    section: Introduction
    order: 0
    status: published

