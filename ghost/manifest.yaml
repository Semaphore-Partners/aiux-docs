# Maps docs/ pages to the Ghost "aiux-docs" collection at
# https://relay.semaphorepartners.com/aiux-docs/
#
# This file is the contract between the docs and whatever publishes them.
# Publishing itself happens outside this repo.
#
#   file:    path relative to docs/
#   slug:    Ghost slug -> /aiux-docs/<slug>/
#   title:   Ghost title (defaults to the page's H1)
#   section: sidebar group; published as the post's public tag
#   order:   sort within the section
#   status:  desired state on the site — published | draft | skip
#   type:    "page" for the collection index (a Ghost page, not a post)
#
# Links between docs are relative; the publisher rewrites them using this table.

site: https://relay.semaphorepartners.com
collection: /aiux-docs/
tags: ["#docs", "#aiux-docs"]

